<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1080px; height: 1350px; overflow: hidden;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        color: #e7ecf5;
        background:
          radial-gradient(700px 460px at 50% -6%, rgba(45,226,230,0.16), transparent 60%),
          radial-gradient(620px 460px at 50% 108%, rgba(182,255,60,0.12), transparent 60%),
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
          #05070d;
        background-size: 100% 100%, 100% 100%, 46px 46px, 46px 46px, 100% 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 70px;
      }
      .symbol { width: 300px; height: 300px; filter: drop-shadow(0 0 40px rgba(45,226,230,0.35)); }
      .word {
        margin-top: 40px; font-size: 168px; font-weight: 800; letter-spacing: -0.04em;
        background: linear-gradient(120deg, #2de2e6, #b6ff3c); -webkit-background-clip: text;
        background-clip: text; color: transparent;
      }
      .sub { margin-top: 8px; font-size: 46px; font-weight: 600; color: #2de2e6; letter-spacing: 0.04em; }
      .tag { margin-top: 26px; font-size: 40px; color: #cdd6e6; line-height: 1.3; max-width: 820px; }
      .tag b { color: #fff; }
      .stack { display: flex; gap: 16px; margin-top: 44px; flex-wrap: wrap; justify-content: center; }
      .chip {
        font-size: 28px; padding: 14px 24px; border-radius: 999px;
        border: 1px solid rgba(45,226,230,0.45); color: #aef3f6; background: rgba(45,226,230,0.06);
      }
      .proof { margin-top: 46px; font-size: 30px; color: #8b96ad; max-width: 860px; line-height: 1.4; }
      .foot { position: absolute; bottom: 54px; display: flex; gap: 26px; font-size: 30px; color: #7f8aa3; }
      .foot b { color: #b6ff3c; font-weight: 700; }
    </style>
  </head>
  <body>
    <svg class="symbol" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2de2e6"/>
          <stop offset="100%" stop-color="#b6ff3c"/>
        </linearGradient>
      </defs>
      <rect x="12" y="12" width="176" height="176" rx="44" fill="#070b14" stroke="url(#cg)" stroke-width="7"/>
      <path d="M148 52 C 92 18, 40 52, 52 104 C 58 134, 92 158, 128 146" fill="none" stroke="url(#cg)" stroke-width="15" stroke-linecap="round"/>
      <path d="M148 52 l 16 -8 M148 52 l 9 15" stroke="url(#cg)" stroke-width="11" stroke-linecap="round" fill="none"/>
      <line x1="104" y1="46" x2="104" y2="158" stroke="#b6ff3c" stroke-width="6" stroke-linecap="round"/>
      <rect x="88" y="74" width="32" height="62" rx="9" fill="#b6ff3c"/>
    </svg>

    <div class="word">CLASP</div>
    <div class="sub">Stocknized Agents</div>
    <div class="tag"><b>Liquidity is the floor.</b> Agents are the product.</div>

    <div class="stack">
      <span class="chip">ClawPump</span>
      <span class="chip">Meteora DBC</span>
      <span class="chip">Pyth</span>
      <span class="chip">Solana</span>
    </div>

    <div class="proof">gasless launch · stock-paired DBC pool · fails closed if the Pyth feed drops</div>

    <div class="foot">
      <span>@he_is_arinzaay</span>
      <span>#CLASP</span>
      <span>#Stocklana</span>
    </div>
  </body>
</html>
