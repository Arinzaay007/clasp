<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05070d;font-family:Inter,Helvetica,Arial,sans-serif;}
#root{position:relative;width:100%;height:100%;overflow:hidden;}
.layer{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;opacity:0;will-change:opacity;}
.badge{position:absolute;top:48px;left:48px;z-index:5;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:#b6ff3c;background:rgba(5,7,13,.6);border:1px solid #1b2233;padding:10px 18px;border-radius:999px;}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 240px 70px rgba(0,0,0,.55);}
.end{position:absolute;left:0;right:0;bottom:90px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;}
.end .w{font-size:110px;font-weight:800;letter-spacing:-.04em;color:#b6ff3c;text-shadow:0 0 60px rgba(182,255,60,.4);}
.end .h{font-size:28px;color:#cdd6e6;margin-top:10px;letter-spacing:.12em;}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
<img class="layer" id="s0" src="screenshots/scroll-000.png"/>
<img class="layer" id="s1" src="screenshots/scroll-085.png"/>
<img class="layer" id="s2" src="screenshots/scroll-100.png"/>
<div class="badge">CLASP - live build</div>
<div class="vignette"></div>
<div class="end" id="end"><div class="w">CLASP</div><div class="h">#CLASP - @he_is_arinzaay</div></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
const ids=["#s0","#s1","#s2"];
const step=3.2,life=3.2,fade=0.7;
ids.forEach((sel,idx)=>{
  const start=idx*step;
  tl.fromTo(sel,{opacity:0},{opacity:1,duration:fade,ease:"power1.out"},start);
  if(idx<ids.length-1) tl.to(sel,{opacity:0,duration:fade,ease:"power1.inOut"},start+life-fade);
});
const endStart=(ids.length-1)*step+0.3;
tl.fromTo("#end",{opacity:0},{opacity:1,duration:0.7},endStart);
tl.to(".badge",{opacity:0,duration:0.5},1.2);
window.__timelines["main"]=tl;tl.seek(0);
</script>
</body>
</html>
